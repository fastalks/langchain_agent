# 1. 定义上游服务（指向FastAPI应用容器）
#upstream app {
#    server app:5000;  # "app"是Docker Compose中FastAPI服务的名称，5000是应用端口
#}

server {
    listen 80;
    server_name localhost;  # 可替换为你的域名或IP

    # 2. 根路径代理（处理所有非/api/的请求）
    # location / {
    #     proxy_pass http://app;  # 修正：补全协议双斜杠
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
        
    #     # 可选：超时设置（避免长请求挂起）
    #     proxy_connect_timeout 60s;
    #     proxy_read_timeout 120s;
    # }
  
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html; # 支持前端路由（如 React Router）
    }


    # 3. /api/路径代理（显式指定后端路径，可省略）
    # 注意：若FastAPI应用监听根路径，此块可合并到上面的`location /`
    location /api/ {
        proxy_pass http://langchain_agent:8000;  # 代理到上游的/api/路径
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 添加CORS头部支持
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        
        # 处理预检请求
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
            return 204;
        }
    }

    location /static/images/ {
        alias /usr/share/nginx/html/static/images/;
    }

    # 5. 错误页面配置
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;  # Nginx默认错误页面路径
    }
}